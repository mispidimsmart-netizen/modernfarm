    <!-- Critical CSS for initial loading state -->
    <style>
      #root:empty {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: linear-gradient(135deg, #f0f7f5 0%, #e0f0ec 100%);
      }
      #root:empty::after {
        content: '';
        width: 48px;
        height: 48px;
        border: 4px solid #1F7A63;
        border-top-color: transparent;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      @media (prefers-color-scheme: dark) {
        #root:empty {
          background: linear-gradient(135deg, #0d1f1a 0%, #061210 100%);
        }
        #root:empty::after {
          border-color: #2DAAE1;
          border-top-color: transparent;
        }
      }
    </style>
